name: PR Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    - name: Run go vet
      run: go vet ./...

    - name: Run gofmt
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "Go files must be formatted with gofmt. Please run:"
          echo "  gofmt -s -w ."
          gofmt -s -l .
          exit 1
        fi

    - name: Install goimports
      run: go install golang.org/x/tools/cmd/goimports@latest

    - name: Run goimports
      run: |
        if [ -n "$(goimports -l .)" ]; then
          echo "Go files must be formatted with goimports. Please run:"
          echo "  goimports -w ."
          goimports -l .
          exit 1
        fi

    - name: Install misspell
      run: go install github.com/client9/misspell/cmd/misspell@latest

    - name: Run misspell
      run: misspell -error .

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    - name: Run tests
      run: go test -v -race ./...

  tdr-controller:
    name: Pull through TDR controller
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Check out git-drs
      uses: actions/checkout@v4

    - name: Check out TDR
      uses: actions/checkout@v4
      with:
        repository: DataBiosphere/jade-data-repo
        ref: 6433cb4ea296edf873daa30f1da29e7caf848b8b
        path: tdr
        persist-credentials: false

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: tdr/build.gradle

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    - name: Pull an AnVIL DRS pointer through TDR's controller
      run: tests/terra-tdr/run.sh "$GITHUB_WORKSPACE/tdr"

  terra-drs-hub:
    name: Resolve through DRS Hub and TDR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Check out git-drs
      uses: actions/checkout@v4

    - name: Check out TDR
      uses: actions/checkout@v4
      with:
        repository: DataBiosphere/jade-data-repo
        ref: 6433cb4ea296edf873daa30f1da29e7caf848b8b
        path: tdr
        persist-credentials: false

    - name: Check out DRS Hub
      uses: actions/checkout@v4
      with:
        repository: DataBiosphere/terra-drs-hub
        ref: 618348c2efeb61d3fb50fd75c447d6ebf3f4192d
        path: drs-hub
        persist-credentials: false

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
        cache-dependency-path: |
          tdr/build.gradle
          drs-hub/service/build.gradle

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.6'

    - name: Pull an AnVIL DRS pointer through DRS Hub and TDR
      run: tests/terra-drs-hub/run.sh "$GITHUB_WORKSPACE/tdr" "$GITHUB_WORKSPACE/drs-hub"
