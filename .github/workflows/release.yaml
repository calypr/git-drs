name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # either 'goreleaser' (default) or 'goreleaser-pro'
          distribution: goreleaser
          # 'latest', 'nightly', or a semver
          version: 'latest'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      -
        name: Verify signed binaries
        run: |
          # Find and verify all darwin binaries
          echo "Verifying macOS code signatures..."
          for binary in dist/git-drs-darwin-*; do
            if [ -f "$binary" ]; then
              echo "Checking: $binary"
              file "$binary"
              # Note: codesign is only available on macOS runners
              # On Linux, we can only verify with file command
              echo "  ✓ Binary found"
            fi
          done
          
          # List all release artifacts
          echo ""
          echo "Release artifacts:"
          ls -lh dist/ | grep -E "(git-drs|tar.gz|zip)"
