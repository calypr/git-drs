name: Syfon Backend E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Syfon Docker E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            run_regex: "TestGitDrsDocker(MinIOE2E|BucketScopePathsE2E)"
          - name: add-url
            run_regex: "TestGitDrsDockerAddURLE2E"
    steps:
      - name: Check out git-drs
        uses: actions/checkout@v4
        with:
          path: git-drs
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'

      - name: Read pinned Syfon ref
        id: syfon-ref
        working-directory: git-drs
        shell: bash
        run: |
          ref="$(tr -d '[:space:]' < tests/integration/docker_syfon/syfon.ref)"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: tests/integration/docker_syfon/syfon.ref must contain one lowercase 40-hex commit" >&2
            exit 1
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using pinned Syfon commit $ref"

      - name: Check out Syfon
        uses: actions/checkout@v4
        with:
          repository: calypr/syfon
          path: syfon
          fetch-depth: 0

      - name: Select pinned Syfon commit
        working-directory: syfon
        shell: bash
        run: |
          git checkout --detach "${{ steps.syfon-ref.outputs.ref }}"
          git rev-parse --verify HEAD

      - name: Install test prerequisites
        working-directory: git-drs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --local

      - name: Run Docker-backed git-drs integration tests
        working-directory: git-drs
        env:
          SYFON_E2E_DOCKER: "1"
          TEST_SYFON_ROOT: ${{ github.workspace }}/syfon
        run: go test -count=1 -tags integration ./tests/integration/docker_syfon -run '^${{ matrix.run_regex }}$' -v
