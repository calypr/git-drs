name: Syfon Backend E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Syfon Docker E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            run_regex: "TestGitDrsDocker(MinIOE2E|BucketScopePathsE2E)"
          - name: add-url
            run_regex: "TestGitDrsDockerAddURLE2E"
    steps:
      - name: Check out git-drs
        uses: actions/checkout@v4
        with:
          path: git-drs
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: git-drs/go.mod

      - name: Resolve Syfon ref from go.mod
        id: syfon-ref
        working-directory: git-drs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(go list -m -f '{{ .Version }}' github.com/calypr/syfon 2>/dev/null || true)"
          if [[ -z "$version" || "$version" == "<nil>" ]]; then
            version="$(go list -m -f '{{ .Version }}' github.com/calypr/syfon/client)"
          fi
          ref="$version"
          if [[ "$version" =~ -([0-9a-f]{12,})$ ]]; then
            short_ref="${BASH_REMATCH[1]}"
            ref=""
            if [[ -n "${GITHUB_TOKEN:-}" ]]; then
              ref="$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/calypr/syfon/commits/$short_ref" | grep -o '"sha": *"[^"]*"' | head -n1 | cut -d'"' -f4 || true)"
            fi
            if [[ -z "$ref" ]]; then
              ref="$(git ls-remote https://github.com/calypr/syfon.git | awk -v want="$short_ref" '$1 ~ ("^" want) { print $1; exit }')"
            fi
            if [[ -z "$ref" ]]; then
              echo "error: could not resolve full Syfon commit for pseudo-version $version (short ref $short_ref)" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using Syfon module version $version; checking out calypr/syfon ref $ref"

      - name: Check out Syfon
        uses: actions/checkout@v4
        with:
          repository: calypr/syfon
          ref: ${{ steps.syfon-ref.outputs.ref }}
          path: syfon
          fetch-depth: 1

      - name: Check out data-client
        uses: actions/checkout@v4
        with:
          repository: calypr/data-client
          path: data-client
          fetch-depth: 1

      - name: Install test prerequisites
        working-directory: git-drs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --local

      - name: Run Docker-backed git-drs integration tests
        working-directory: git-drs
        env:
          SYFON_E2E_DOCKER: "1"
          TEST_SYFON_ROOT: ${{ github.workspace }}/syfon
        run: go test -count=1 -tags integration ./tests/integration/docker_syfon -run '^${{ matrix.run_regex }}$' -v
