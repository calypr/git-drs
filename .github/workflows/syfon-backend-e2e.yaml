name: Syfon Backend E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Syfon Docker E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            run_regex: "TestGitDrsDocker(MinIOE2E|BucketScopePathsE2E)"
          - name: add-url
            run_regex: "TestGitDrsDockerAddURLE2E"
    steps:
      - name: Check out git-drs
        uses: actions/checkout@v4
        with:
          path: git-drs
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: git-drs/go.mod

      - name: Resolve Syfon source from pinned module version
        id: syfon-source
        working-directory: git-drs
        shell: bash
        run: |
          version="$(go list -m -f '{{ .Version }}' github.com/calypr/syfon)"
          if [[ -z "$version" || "$version" == "<nil>" ]]; then
            echo "error: could not resolve pinned syfon version" >&2
            exit 1
          fi

          go mod download github.com/calypr/syfon
          root="$(go list -m -f '{{ .Dir }}' github.com/calypr/syfon)"
          if [[ -z "$root" || "$root" == "<nil>" || ! -d "$root" ]]; then
            echo "error: could not resolve downloaded syfon source directory for $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Using Syfon module version $version from $root"

      - name: Install test prerequisites
        working-directory: git-drs
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install --local

      - name: Run Docker-backed git-drs integration tests
        working-directory: git-drs
        env:
          SYFON_E2E_DOCKER: "1"
          TEST_SYFON_ROOT: ${{ steps.syfon-source.outputs.root }}
          GOWORK: "off"
        run: go test -count=1 -tags integration ./tests/integration/docker_syfon -run '^${{ matrix.run_regex }}$' -v
