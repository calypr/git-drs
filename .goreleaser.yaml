version: 2

builds:
  - id: darwin-amd64
    binary: git-drs
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - codesign --force --options=runtime -s "{{ .Env.APPLE_TEAM_ID }}" "{{ .Path }}"
  - id: darwin-arm64
    binary: git-drs
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    hooks:
      post:
        - codesign --force --options=runtime -s "{{ .Env.APPLE_TEAM_ID }}" "{{ .Path }}"
  - id: linux-amd64
    binary: git-drs
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=0
  - id: linux-arm64
    binary: git-drs
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0

dist: build/release

release:
  draft: false

env_files:
  github_token: .github_token

archives:
  - formats:
      - tar.gz
    name_template: "{{.ProjectName}}-{{.Os}}-{{.Arch}}-v{{.Version}}"
    files:
      - none: "*"
